<div class="top-bar">
  <span>{{ JSON.parse(localStorage.getItem('user') || '{}')?.email }}</span>
  <button (click)="logout()">Logout</button>
</div>

<div class="card">
  <h3>Add New Task</h3>
  <input placeholder="Task title" [(ngModel)]="task.title" />
  <textarea placeholder="Task description" [(ngModel)]="task.description"></textarea>

  <div class="row">
    <input placeholder="Assignee name" [(ngModel)]="task.name" />
    <input placeholder="Assignee email" [(ngModel)]="task.email" />
    <button (click)="addAssignee()">+ Add</button>
  </div>

  <input type="date" [min]="minDate" [(ngModel)]="task.dueDate" />

  <button class="add-btn" (click)="addTask()">+ Add Task</button>
</div>

<div class="card" *ngFor="let t of tasks">
  <h4>{{ t.title }}</h4>
  <p>{{ t.description }}</p>
  <p>Due: {{ t.dueDate }}</p>

  <div class="assignee" *ngFor="let a of t.assignees">
    <b>{{ a.name }}</b> – {{ a.email }}
  </div>
</div>
